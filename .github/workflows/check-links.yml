name: Check links

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress './**/*.md'
          fail: true
